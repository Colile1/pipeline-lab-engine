# The fifth factor: hyperparameter tuning, nested inner k = 3.
#
# Measured cost: tuning is about 90% of a full five-factor programme
# (690 s of 768 s on one small dataset), because nested CV turns one
# configuration into 30 fits instead of 10 and the tree models dominate.
# So this runs on the 16 small and mid-size datasets only;
# abalone, cpu_small and kin8nm are excluded, and the three datasets
# over 20,000 rows were never in scope.
#
# Bayesian needs optuna-integration, which was missing until 2026-10-12
# and is now pinned in requirements.txt.
name: ofat_tuning_v2
vary: tuning
techniques: [none, random, grid, bayesian]
datasets: [iris, wine, sonar, heart-c, ionosphere, colic, breast_cancer, wdbc, credit-approval, pima, credit-g, digits, autoMpg, diabetes, energy-efficiency, concrete]
models: [logreg, svm, random_forest, gradient_boosting]
seed: 671
evaluation:
  protocol: kfold
  cv_k: 10
  inner_k: 3
outputs_dir: outputs/
