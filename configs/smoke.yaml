# configs/smoke.yaml - tiny end-to-end check, offline only.
# 2 techniques x 2 bundled datasets x 1 model, k=3, so the whole
# pipeline (load -> characterise -> compose -> evaluate -> record)
# runs in seconds with no network.
name: smoke
vary: scaling
techniques: [none, standard]
datasets: [iris, wine]
models: [logreg]
seed: 671
evaluation:
  protocol: kfold
  cv_k: 3
outputs_dir: outputs/
